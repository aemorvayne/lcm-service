title = "Public repository privacy checks"

[extend]
useDefault = true

[[rules]]
id = "personal-email"
description = "Use reserved example domains for public contact fixtures"
regex = '''(?i)[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}'''

[[rules.allowlists]]
regexes = ['''(?i)@(?:[a-z0-9-]+\.)*example\.(?:com|net|org)$''', '''(?i)@users\.noreply\.github\.com$''']

[[rules]]
id = "private-file"
description = "Private documents and credentials must stay outside public repositories"
path = '''(?i)(^|/)(task[^/]*\.(txt|pdf|zip)|puzzle[^/]*\.txt|users\.json|\.env(\.[^/]*)?|[^/]*\.(key|pem|p12|pfx|kdbx|bundle|zip|tar|gz|7z|sqlite|sqlite3|db|dump)|id_(rsa|ed25519)|credentials(\.[^/]*)?|secrets(\.[^/]*)?|(?:private|confidential)(/.*)?)$'''

[[rules.allowlists]]
paths = ['''(^|/)\.env\.example$''']
