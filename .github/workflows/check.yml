name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5.2.1
      - run: mise run setup
      - run: mise run check
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t lcm-service .
      - run: docker run --detach --name lcm-service --publish 8080:8080 lcm-service
      - run: curl --fail --retry 10 --retry-all-errors --retry-delay 1 'http://localhost:8080/your_name_example_com?x=12&y=18'
      - run: docker logs lcm-service
        if: always()
      - run: docker rm --force lcm-service
        if: always()
